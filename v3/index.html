<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praveen Kumar — Frontend Developer &amp; AI Builder</title>
  <meta name="description" content="Portfolio of Praveen Kumar — frontend developer building fast, local-first products and AI tools." />
  <meta name="theme-color" id="themeColor" content="#f1eee7" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var root = document.documentElement;
      var theme;
      try {
        var saved = localStorage.getItem("pk-theme");
        theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (error) {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
